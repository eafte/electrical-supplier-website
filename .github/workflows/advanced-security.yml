name: Advanced Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  # SAST - Static Application Security Testing
  sast-codeql:
    name: CodeQL Analysis (SAST)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  # Dependency vulnerability scanning with Snyk
  snyk-scan:
    name: Snyk Vulnerability Scan
    runs-on: ubuntu-latest

    # Disabled by default: requires SNYK_TOKEN secret (and secrets are not available for forks).
    # Enable when configured.
    if: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Snyk to check for vulnerabilities (Backend)
        uses: snyk/actions/node@master
        continue-on-error: true
        with:
          args: --severity-threshold=high --file=backend/package.json
          command: test

      - name: Run Snyk to check for vulnerabilities (Frontend)
        uses: snyk/actions/node@master
        continue-on-error: true
        with:
          args: --severity-threshold=high --file=frontend/package.json
          command: test

  # Repository filesystem vulnerability scanning
  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      # This only produces the Security tab report; the step above is the gate.
      - name: Generate Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # OWASP Dependency Check
  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Depcheck (Backend)
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: 'electrical-supplier-backend'
          path: './backend'
          format: 'HTML'
          out: 'reports'

      - name: Upload Dependency Check results
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: reports/

  # License compliance check
  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Check licenses (Backend)
        working-directory: ./backend
        run: npx license-checker --summary

      - name: Check licenses (Frontend)
        working-directory: ./frontend
        run: npx license-checker --summary

  # Security headers check on the app started inside the job
  security-headers-check:
    name: Security Headers Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: file:./dev.db
      JWT_SECRET: ci-lighthouse-jwt-secret-change-me-32chars
      JWT_REFRESH_SECRET: ci-lighthouse-refresh-secret-change-me-32chars
      COOKIE_SECRET: ci-lighthouse-cookie-secret-change-me-32chars
      SEED_ADMIN_PASSWORD: ci-lighthouse-seed-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --include=dev
          (cd backend && npm ci --include=dev)
          (cd frontend && npm ci --include=dev)

      - name: Setup database
        working-directory: ./backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run prisma:seed

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Start backend (background)
        working-directory: ./backend
        run: npm run start > backend.log 2>&1 &

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5000/health >/dev/null; then
              echo "Backend is up"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          tail -n 100 backend/backend.log
          exit 1

      - name: Verify security headers
        run: |
          failures=0
          check_header() {
            if ! grep -i -E "$2" headers.txt >/dev/null; then echo "$1: missing or invalid $3"; failures=1; fi
          }
          for url in http://localhost:5000/health http://localhost:5000/; do
            if curl -sS -D headers.txt -o /dev/null -H 'X-Forwarded-Proto: https' "$url"; then
              check_header "$url" '^[[:space:]]*x-content-type-options:[[:space:]]*nosniff[[:space:]]*$' x-content-type-options
              check_header "$url" '^[[:space:]]*x-frame-options:[[:space:]]*DENY[[:space:]]*$' x-frame-options
              check_header "$url" '^[[:space:]]*content-security-policy:[[:space:]]*[^[:space:]].*$' content-security-policy
              check_header "$url" '^[[:space:]]*referrer-policy:[[:space:]]*[^[:space:]].*$' referrer-policy
              check_header "$url" '^[[:space:]]*strict-transport-security:' strict-transport-security
              for header in cross-origin-opener-policy cross-origin-resource-policy origin-agent-cluster x-dns-prefetch-control x-download-options x-permitted-cross-domain-policies x-xss-protection; do
                check_header "$url" "^[[:space:]]*$header:" "$header"
              done
              if grep -i -E '^[[:space:]]*x-powered-by:' headers.txt >/dev/null; then echo "$url: unexpected x-powered-by"; failures=1; fi
            else
              echo "$url: HTTP response headers (request failed)"; failures=1
            fi
          done
          exit "$failures"

  # Summary report
  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [sast-codeql, snyk-scan, owasp-dependency-check, license-check]
    if: always()

    steps:
      - name: Check scan results
        run: |
          echo "=== Security Scan Results ==="
          echo "CodeQL SAST: ${{ needs.sast-codeql.result }}"
          echo "Snyk Scan: ${{ needs.snyk-scan.result }}"
          echo "OWASP Dependency Check: ${{ needs.owasp-dependency-check.result }}"
          echo "License Check: ${{ needs.license-check.result }}"

          if [ "${{ needs.sast-codeql.result }}" == "failure" ]; then
            echo "⚠️ CodeQL found security issues"
          fi

          if [ "${{ needs.snyk-scan.result }}" == "failure" ]; then
            echo "⚠️ Snyk found vulnerabilities"
          fi
